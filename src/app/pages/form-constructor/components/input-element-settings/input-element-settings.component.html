<flex-block gapSize="0">
  <button (click)="removeClicked.emit()" mat-button>Remove</button>
  <button (click)="isOpen = !isOpen" cdkOverlayOrigin #trigger="cdkOverlayOrigin" mat-button>Configure</button>
</flex-block>
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen" [cdkConnectedOverlayPositions]="[position()]">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h5>Input</h5>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="inputSettingsForm" flex-block flexDirection="column">
        <mat-form-field>
          <mat-label>Label</mat-label>
          <input [formControl]="inputSettingsForm.controls.label" placeholder="Label for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Placeholder</mat-label>
          <input [formControl]="inputSettingsForm.controls.placeholder" placeholder="Placeholder for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Hint</mat-label>
          <input [formControl]="inputSettingsForm.controls.hint" placeholder="Hint for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Input Type</mat-label>
          <mat-select [formControl]="inputSettingsForm.controls.inputType">
            @for (inputType of inputTypeOptionList(); track inputType) {
              <mat-option [value]="inputType">{{ inputType }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="isOpen = !isOpen" mat-button>Close</button>
    </mat-card-actions>
  </mat-card>
</ng-template>
