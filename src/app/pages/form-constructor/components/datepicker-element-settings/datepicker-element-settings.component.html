<form-element-actions (removeClicked)="removeClicked.emit()" (configureClicked)="openSettings()" cdkOverlayOrigin #trigger="cdkOverlayOrigin" />
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isSettingsOpen"
  [cdkConnectedOverlayPositions]="CDK_CONNECTED_OVERLAY_POSITIONS"
  [cdkConnectedOverlayScrollStrategy]="cdkConnectedOverlayScrollStrategy"
  (overlayOutsideClick)="closeSettings()"
  (detach)="closeSettings()"
>
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h5>Datepicker</h5>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="datepickerSettingsForm" flex-block flexDirection="column">
        <mat-form-field>
          <mat-label>Label</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.label" placeholder="Label for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Placeholder</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.placeholder" placeholder="Placeholder for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Hint</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.hint" placeholder="Hint for element" matInput />
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="closeSettings()" mat-button>Close</button>
    </mat-card-actions>
  </mat-card>
</ng-template>
