<form-element-actions (removeClicked)="removeClicked.emit()" (configureClicked)="isSettingsOpen = !isSettingsOpen" cdkOverlayOrigin #trigger="cdkOverlayOrigin" />
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isSettingsOpen"
  [cdkConnectedOverlayPositions]="[SETTINGS_OVERLAY_POSITION_RIGHT]"
  (overlayOutsideClick)="isSettingsOpen = !isSettingsOpen"
>
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h5>Datepicker</h5>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="datepickerSettingsForm" flex-block flexDirection="column">
        <mat-form-field>
          <mat-label>Label</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.label" placeholder="Label for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Placeholder</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.placeholder" placeholder="Placeholder for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Hint</mat-label>
          <input [formControl]="datepickerSettingsForm.controls.hint" placeholder="Hint for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Datepicker Type</mat-label>
          <mat-select [formControl]="datepickerSettingsForm.controls.datepickerType">
            @for (datepickerType of datepickerTypeOptionList(); track datepickerType) {
              <mat-option [value]="datepickerType">{{ datepickerType }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="isSettingsOpen = !isSettingsOpen" mat-button>Close</button>
    </mat-card-actions>
  </mat-card>
</ng-template>
