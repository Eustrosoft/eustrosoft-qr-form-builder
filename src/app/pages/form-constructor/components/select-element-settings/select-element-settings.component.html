<form-element-actions (removeClicked)="removeClicked.emit()" (configureClicked)="isSettingsOpen = !isSettingsOpen" cdkOverlayOrigin #trigger="cdkOverlayOrigin" />
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isSettingsOpen"
  [cdkConnectedOverlayPositions]="[SETTINGS_OVERLAY_POSITION_RIGHT]"
  (overlayOutsideClick)="isSettingsOpen = !isSettingsOpen"
>
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h5>Select</h5>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="selectSettingsForm" flex-block flexDirection="column">
        <mat-form-field>
          <mat-label>Label</mat-label>
          <input [formControl]="selectSettingsForm.controls.label" placeholder="Label for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Placeholder</mat-label>
          <input [formControl]="selectSettingsForm.controls.placeholder" placeholder="Placeholder for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Hint</mat-label>
          <input [formControl]="selectSettingsForm.controls.hint" placeholder="Hint for element" matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Option list</mat-label>
          <input [formControl]="selectSettingsForm.controls.optionList" placeholder="Option list for select" matInput />
          <mat-hint>Example: first,second,third</mat-hint>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="isSettingsOpen = !isSettingsOpen" mat-button>Close</button>
    </mat-card-actions>
  </mat-card>
</ng-template>
