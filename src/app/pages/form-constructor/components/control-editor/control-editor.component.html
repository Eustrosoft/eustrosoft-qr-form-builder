<mat-form-field>
  <mat-label>Form Title</mat-label>
  <input matInput type="text" placeholder="Title for form" [ngModel]="formTitle()" (ngModelChange)="setFormTitle($event)" />
</mat-form-field>
<mat-form-field>
  <mat-label>Form Description</mat-label>
  <textarea
    matInput
    cdkTextareaAutosize
    cdkAutosizeMaxRows="4"
    placeholder="Brief description for form"
    [ngModel]="formDescription()"
    (ngModelChange)="setFormDescription($event)"
  ></textarea>
</mat-form-field>
<ui-divider />
@for (formField of formFieldList(); track index; let index = $index) {
  @if (formElementService.isInputElement(formField)) {
    <flex-block gapSize="8" flexDirection="column">
      <input-element
        [formControl]="formField.formControl"
        [label]="formField.label"
        [placeholder]="formField.placeholder"
        [hint]="formField.hint"
        [inputType]="formField.inputType"
      />
      <input-element-settings
        [label]="formField.label"
        [placeholder]="formField.placeholder"
        [hint]="formField.hint"
        [inputType]="formField.inputType"
        (settingsChanged)="patchInputElementSettings($event, index)"
        (removeClicked)="removeFormElement(formField.controlElement, index)"
      />
    </flex-block>
  }
  @if (formElementService.isSelectElement(formField)) {
    <flex-block gapSize="8" flexDirection="column">
      <select-element
        [formControl]="formField.formControl"
        [label]="formField.label"
        [placeholder]="formField.placeholder"
        [hint]="formField.hint"
        [optionList]="formField.optionList"
      />
      <select-element-settings
        [label]="formField.label"
        [placeholder]="formField.placeholder"
        [hint]="formField.hint"
        [optionList]="formField.optionList"
        (settingsChanged)="patchSelectElementSettings($event, index)"
        (removeClicked)="removeFormElement(formField.controlElement, index)"
      />
    </flex-block>
  }
  @if (formElementService.isDatepickerElement(formField)) {
    <flex-block gapSize="8" flexDirection="column">
      <datepicker-element [formControl]="formField.formControl" [label]="formField.label" [placeholder]="formField.placeholder" [hint]="formField.hint" />
      <datepicker-element-settings
        [label]="formField.label"
        [placeholder]="formField.placeholder"
        [hint]="formField.hint"
        (settingsChanged)="patchDatepickerElementSettings($event, index)"
        (removeClicked)="removeFormElement(formField.controlElement, index)"
      />
    </flex-block>
  }
}
