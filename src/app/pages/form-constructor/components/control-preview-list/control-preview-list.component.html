<mat-card>
  <mat-card-header>
    <mat-card-title>Common</mat-card-title>
    <mat-card-subtitle></mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <flex-block>
      @for (formEl of formElementList(); track formEl.label) {
        <control-preview [name]="formEl.label" [controlElement]="formEl.controlElement" (controlElementClick)="addControlToEditor($event)" />
      }
    </flex-block>
  </mat-card-content>
</mat-card>
